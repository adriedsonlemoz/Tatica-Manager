name: Flutter - Analisar, Testar e Gerar APK

on:
  push:
    branches:
      - main
      - flutter-rebuild-stage1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter 3.47.1 / Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Ler e validar versão da release
        id: version
        shell: bash
        run: |
          python3 tool/versioning.py verify
          python3 - <<'PY_VERSION' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open('al-sistemas.json', encoding='utf-8'))
          print(f"release={data['version']}")
          print(f"version_code={data['android']['versionCode']}")
          PY_VERSION

      - name: Java 17 + cache Gradle
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/app/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter 3.47.1
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
          pub-cache: true

      - name: Validar plataforma Android versionada
        shell: bash
        run: |
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          python3 tool/configure_platforms.py
          python3 tool/versioning.py verify

      - name: Validar ícones do aplicativo
        run: python3 tool/verify_app_icons.py

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-pub

      - name: Testes
        run: flutter test --no-pub

      - name: Validar configuração opcional da assinatura persistente
        shell: bash
        env:
          TATICA_KEYSTORE_BASE64: ${{ secrets.TATICA_KEYSTORE_BASE64 }}
          TATICA_KEYSTORE_PASSWORD: ${{ secrets.TATICA_KEYSTORE_PASSWORD }}
          TATICA_KEY_ALIAS: ${{ secrets.TATICA_KEY_ALIAS }}
          TATICA_KEY_PASSWORD: ${{ secrets.TATICA_KEY_PASSWORD }}
        run: |
          configured=0
          for value in "$TATICA_KEYSTORE_BASE64" "$TATICA_KEYSTORE_PASSWORD" "$TATICA_KEY_ALIAS" "$TATICA_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "Assinatura persistente configurada parcialmente. Cadastre os quatro Secrets ou remova todos temporariamente."
            exit 1
          fi
          if [ "$configured" -eq 0 ]; then
            echo "Secrets de assinatura ainda não configurados: esta build usará temporariamente a chave debug do runner."
          fi

      - name: Reconstruir assinatura release persistente
        shell: bash
        env:
          TATICA_KEYSTORE_BASE64: ${{ secrets.TATICA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TATICA_KEYSTORE_BASE64" ]; then
            echo "Keystore persistente ainda não configurada; mantendo fallback temporário."
            exit 0
          fi
          printf '%s' "$TATICA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tatica-manager-release.jks"
          test -s "$RUNNER_TEMP/tatica-manager-release.jks"

      - name: Gerar APK release
        env:
          # Runner efêmero: não precisamos manter o watcher VFS do Gradle ativo.
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
          TATICA_KEYSTORE_PATH: ${{ runner.temp }}/tatica-manager-release.jks
          TATICA_KEYSTORE_PASSWORD: ${{ secrets.TATICA_KEYSTORE_PASSWORD }}
          TATICA_KEY_ALIAS: ${{ secrets.TATICA_KEY_ALIAS }}
          TATICA_KEY_PASSWORD: ${{ secrets.TATICA_KEY_PASSWORD }}
        run: flutter build apk --release --no-pub

      - name: Validar versão embutida no APK
        shell: bash
        run: |
          python3 - <<'PY_APK'
          import json
          from pathlib import Path
          manifest = json.load(open('al-sistemas.json', encoding='utf-8'))
          metadata = Path('build/app/outputs/apk/release/output-metadata.json')
          if not metadata.exists():
              metadata = Path('build/app/outputs/flutter-apk/output-metadata.json')
          if not metadata.exists():
              raise SystemExit('output-metadata.json do Android não encontrado')
          data = json.loads(metadata.read_text(encoding='utf-8'))
          element = data['elements'][0]
          expected_name = manifest['android']['versionName']
          expected_code = manifest['android']['versionCode']
          actual_name = element.get('versionName')
          actual_code = element.get('versionCode')
          if actual_name != expected_name or actual_code != expected_code:
              raise SystemExit(
                  f'APK com versão incorreta: {actual_name} ({actual_code}); '
                  f'esperado {expected_name} ({expected_code})'
              )
          print(f'APK validado: {actual_name} (versionCode {actual_code})')
          PY_APK

      - name: Preparar APK versionado
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/tatica-manager-${{ steps.version.outputs.release }}.apk"

      - name: Upload somente do APK
        uses: actions/upload-artifact@v7.0.1
        with:
          path: dist/tatica-manager-${{ steps.version.outputs.release }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
